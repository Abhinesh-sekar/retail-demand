data:
  raw_data_path: "data/raw/sales_train.parquet"
  calendar_data_path: "data/raw/calendar.parquet"
  prices_data_path: "data/raw/sell_prices.parquet"
  processed_data_path: "data/processed/featured_sales.parquet"
  num_skus: 20
  num_stores: 4
  days_history: 730  # 2 years of daily data
  start_date: "2024-01-01"

features:
  lags: [1, 2, 7, 14, 21, 28]
  rolling_windows: [7, 14, 28, 60]
  forecast_horizon: 28
  categorical_cols: ["item_id", "store_id", "dept_id", "cat_id", "state_id"]
  target_col: "sales"
  date_col: "date"

models:
  lightgbm:
    objective: "tweedie"
    tweedie_variance_power: 1.15
    metric: "rmse"
    boosting_type: "gbdt"
    learning_rate: 0.05
    num_leaves: 63
    max_depth: 8
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    n_estimators: 300
    early_stopping_rounds: 30
    random_state: 42
    n_jobs: -1

backtest:
  n_splits: 3
  test_size_days: 28
  step_size_days: 28

anomaly:
  z_threshold: 3.0
  rolling_window: 14
  min_expected_demand: 1.0
  severity_high_threshold: 4.0

api:
  host: "0.0.0.0"
  port: 8000
  title: "Retail Demand Forecasting & Anomaly Detection API"
  version: "1.0.0"
